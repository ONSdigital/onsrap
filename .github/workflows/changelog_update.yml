name: Changelog Update  

on:
  push:
    tags:
        - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to simulate a push event (e.g. v1.2.3).'
        required: true
permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
    change_log:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Branch
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                fetch-depth: 0
                token: ${{ secrets.ACCESS_TOKEN }}
            - name: Generate changelog
              uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
              with:
                config: cliff.toml
                args: --verbose
              env:
                OUTPUT: CHANGELOG.md
                GITHUB_REPO: ${{ github.repository }}

            - name: Commit and retag
              run: |
                git config user.name 'github-actions[bot]'
                git config user.email 'github-actions[bot]@users.noreply.github.com'
                git add CHANGELOG.md
                if git diff --cached --quiet; then
                  echo "No changelog changes, skipping."
                  exit 0
                fi
                TAG_NAME="${INPUT_TAG_NAME:-${GITHUB_REF#refs/tags/}}"
                git commit -m "Update changelog for ${TAG_NAME}"
                git push origin HEAD:release_staging
                git tag -f "${TAG_NAME}"
                git push origin -f "${TAG_NAME}"
