[metadata]
name = onsrap
description = A simple Pipeline orchestration package.
version = 0.0.1
author = ONSDigital
platforms = win32
classifiers =
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages =
    onsrap
python_requires = >=3.9
zip_safe = no
install_requires =
    pyyaml

[options.extras_require]
dev =
    coverage
    detect-secrets == 1.0.3
    myst-parser
    pre-commit
    pytest
    detect-secrets
    python-dotenv
    Sphinx
    toml